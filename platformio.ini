[platformio]
src_dir = firmware/fpv_drone_teensy
test_dir = test

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; No external CMSIS-DSP lib_dep needed - the Teensy Arduino core
; (framework-arduinoteensy) already bundles arm_math.h / CMSIS-DSP.

; Increase serial monitor baud for high-rate logs
monitor_speed = 115200

; Build flags
build_flags =
    -D USB_SERIAL
    -D TEENSYDUINO=159

[env:native_test]
platform = native
build_flags = -I firmware/fpv_drone_teensy -I test/native_shim -std=gnu++17